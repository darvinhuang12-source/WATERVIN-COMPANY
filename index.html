<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watervin Academy - Mandarin Learning Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #120305;
      --sidebar-bg: #1a0507;
      --card-bg: #2d0a0e;
      --card-border: #4a151b;
      --gold-primary: #e5a93c;
      --gold-bright: #ffd166;
      --text-white: #ffffff;
      --text-muted: #b89b9e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-white); display: flex; min-height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.2rem;
      color: var(--gold-primary);
      text-align: center;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-white);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      background: transparent;
      text-align: left;
      width: 100%;
    }

    .nav-item.active {
      background: linear-gradient(90deg, #3a0d12 0%, #26080b 100%);
      border: 1.5px solid var(--gold-primary);
      color: var(--gold-bright);
    }

    .nav-item:hover:not(.active) { background: rgba(229, 169, 60, 0.1); }

    /* MAIN CONTENT */
    .main-content { flex: 1; padding: 30px; overflow-y: auto; }
    
    .header-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 30px;
      margin-bottom: 24px;
    }

    .header-title { font-size: 1.8rem; color: var(--gold-primary); margin-bottom: 8px; }
    .header-subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .content-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      min-height: 400px;
    }

    /* CONTROLS */
    .controls-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .search-box {
      flex: 1;
      min-width: 250px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background: #120305;
      border: 1px solid var(--gold-primary);
      border-radius: 12px;
      padding: 10px 16px;
      color: var(--text-white);
      font-size: 0.95rem;
      outline: none;
    }

    .search-input::placeholder { color: var(--text-muted); }

    /* HSK SELECTOR */
    .hsk-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn {
      background: #1a0507;
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--gold-primary);
      color: #120305;
      border-color: var(--gold-primary);
    }

    /* KAMUS GRID */
    .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .vocab-card {
      background: rgba(20, 4, 6, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
    }
    .vocab-card:hover { border-color: var(--gold-primary); transform: translateY(-4px); }
    .card-hanzi { font-size: 2.2rem; font-weight: 700; color: var(--gold-primary); margin-bottom: 6px; }
    .card-pinyin { color: var(--gold-bright); font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
    .card-arti { color: var(--text-muted); font-size: 0.85rem; }
    .card-level {
      position: absolute;
      top: 8px;
      right: 12px;
      font-size: 0.7rem;
      background: rgba(229, 169, 60, 0.15);
      color: var(--gold-bright);
      padding: 2px 6px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }

    /* MULTI-HANZI DISPLAY */
    .multi-section-title {
      color: var(--gold-bright);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 12px;
      text-align: left;
    }

    .multi-space-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: center;
      margin-bottom: 20px;
    }

    .writing-box-single {
      background: #120305;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      flex: 0 0 180px;
    }

    .writer-display-space {
      width: 140px;
      height: 140px;
      margin: 0 auto 10px;
      background: #120305;
      border: 2px dashed var(--gold-primary);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .select-dropdown {
      background: #120305;
      color: var(--gold-bright);
      border: 1px solid var(--gold-primary);
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      max-width: 500px;
      margin-bottom: 15px;
      outline: none;
      cursor: pointer;
    }

    .btn-action {
      background: var(--gold-primary); color: #120305; border: none;
      padding: 8px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; margin: 4px;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    .btn-action:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--gold-primary); color: var(--gold-bright); }

    /* MODAL POPUP DETAIL KAMUS */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
    }
    .modal-overlay.show { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--card-bg); border: 2px solid var(--gold-primary);
      border-radius: 20px; width: 92%; max-width: 580px; padding: 24px;
      text-align: center; position: relative; max-height: 90vh; overflow-y: auto;
    }
    .close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }

    /* KARTU HAPALAN (FLASHCARDS) */
    .flashcard-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 500px;
      margin: 0 auto;
    }
    .flashcard {
      width: 100%;
      height: 300px;
      background: rgba(20, 4, 6, 0.8);
      border: 2px solid var(--gold-primary);
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.4s;
      transform-style: preserve-3d;
      padding: 20px;
      text-align: center;
    }
    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;
      padding: 20px;
    }
    .flashcard-back {
      transform: rotateY(180deg);
      background: #25070a;
      border-radius: 20px;
    }
    .flashcard.flipped {
      transform: rotateY(180deg);
    }
    .flashcard-controls {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    /* POLA KALIMAT */
    .pola-card {
      background: rgba(20, 4, 6, 0.7);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      text-align: left;
    }
    .pola-title {
      color: var(--gold-bright);
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .pola-formula {
      background: #120305;
      border-left: 4px solid var(--gold-primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: monospace;
      color: var(--gold-primary);
      margin-bottom: 10px;
    }
    .pola-example {
      color: var(--text-white);
      font-size: 0.95rem;
      margin-bottom: 4px;
    }
    .pola-arti {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* TES HSK & TUGAS */
    .quiz-container {
      max-width: 650px;
      margin: 0 auto;
      text-align: left;
    }
    .quiz-question {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--gold-bright);
      margin-bottom: 16px;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .quiz-option-btn {
      background: #120305;
      border: 1px solid var(--card-border);
      color: var(--text-white);
      padding: 12px 16px;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    .quiz-option-btn:hover {
      border-color: var(--gold-primary);
      background: rgba(229, 169, 60, 0.05);
    }
    .quiz-option-btn.correct {
      background: rgba(40, 167, 69, 0.2);
      border-color: #28a745;
      color: #75b798;
    }
    .quiz-option-btn.wrong {
      background: rgba(220, 53, 69, 0.2);
      border-color: #dc3545;
      color: #ea868f;
    }

    /* PERCAKAPAN */
    .chat-bubble-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 600px;
      margin: 0 auto;
      text-align: left;
    }
    .chat-bubble {
      background: #120305;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
    }
    .chat-speaker {
      font-size: 0.8rem;
      color: var(--gold-primary);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .chat-text-zh {
      font-size: 1.1rem;
      color: var(--gold-bright);
      font-weight: 600;
    }
    .chat-text-id {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* RAPOR & SERTIFIKAT */
    .certificate-card {
      background: linear-gradient(135deg, #2d0a0e 0%, #1a0507 100%);
      border: 3px double var(--gold-primary);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 650px;
      margin: 0 auto;
    }
  </style>
</head>

      modalWriters.forEach((writer, i) => {

        }, i * 800);
      });

    function playAudioText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }
    }

    /* MENULIS MULTI-HANZI UNTUK KANVAS & ANIMASI */
    function onSelectVocabToPractice(word) {
      const container = document.getElementById('multiWritingContainer');
      if (!container) return;
      
      container.innerHTML = '';
      practiceWriters = [];
      canvasContexts = [];

      const characters = word.replace(/[^\u4e00-\u9fa5]/g, '').split('');

      let htmlContent = `
        <div class="multi-section-title">1. Contoh / Animasi Goresan (${characters.length} Karakter)</div>
        <div class="multi-space-grid">
          ${characters.map((char, index) => `
            <div class="writing-box-single">
              <div style="color: var(--gold-bright); font-weight:600; font-size:0.85rem; margin-bottom:6px;">Karakter ${index+1}:${char}</div>
              <div class="writer-display-space" id="writer-target-${index}"></div>
              <button class="btn-action" style="font-size:0.8rem; padding: 4px 10px;" onclick="playSingleAnimation(${index})">▶ Animasi</button>
            </div>
          `).join('')}
        </div>

        <div class="multi-section-title">2. Kanvas Latihan Menulis (${characters.length} Space Kanvas)</div>
        <div class="multi-space-grid">
          ${characters.map((char, index) => `
            <div class="writing-box-single">
              <div style="color: var(--gold-bright); font-weight:600; font-size:0.85rem; margin-bottom:6px;">Tulis Karakter ${index+1} (${char})</div>
              <canvas id="paintCanvas-${index}" width="140" height="140" style="background:#120305; border: 2px dashed var(--gold-primary); border-radius: 16px; cursor: crosshair;"></canvas>
              <div style="margin-top: 6px;">
                <button class="btn-action btn-secondary" style="font-size:0.8rem; padding: 4px 10px;" onclick="clearSingleCanvas(${index})">🗑️ Hapus</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      container.innerHTML = htmlContent;

      characters.forEach((char, index) => {
        const writer = HanziWriter.create(`writer-target-${index}`, char, {
          width: 130,
          height: 130,
          padding: 5,
          showOutline: true,
          strokeColor: '#e5a93c',
          outlineColor: '#4a151b'
        });
        practiceWriters.push(writer);

        initCanvasForIndex(index);
      });

      playAllAnimations();
    }

    function playSingleAnimation(index) {
      if (practiceWriters[index]) {
        practiceWriters[index].animateCharacter();
      }
    }

    function playAllAnimations() {
      practiceWriters.forEach((writer, i) => {
        setTimeout(() => {
          writer.animateCharacter();
        }, i * 1000);
      });
    }

    function initCanvasForIndex(index) {
      const canvas = document.getElementById(`paintCanvas-${index}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      canvasContexts[index] = { canvas, ctx, isDrawing: false };

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
      }

      function startDraw(e) {
        canvasContexts[index].isDrawing = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      }

      function draw(e) {
        if (!canvasContexts[index].isDrawing) return;
        e.preventDefault();
        const pos = getPos(e);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
      }

      function stopDraw() {
        canvasContexts[index].isDrawing = false;
      }

      canvas.onmousedown = startDraw;
      canvas.onmousemove = draw;
      canvas.onmouseup = stopDraw;
      canvas.ontouchstart = startDraw;
      canvas.ontouchmove = draw;
      canvas.ontouchend = stopDraw;
    }

    function clearSingleCanvas(index) {
      if (canvasContexts[index]) {
        const { canvas, ctx } = canvasContexts[index];
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function clearAllCanvases() {
      canvasContexts.forEach((item, index) => {
        clearSingleCanvas(index);
      });
    }

    window.onload = function() {
      renderPage();
    };
  </script>
</body>
</html>
